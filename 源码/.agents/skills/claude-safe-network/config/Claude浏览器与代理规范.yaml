schema-version: 1
name: Claude浏览器与代理Windows复用规范
scope:
  operating-system: Windows 11
  browser: Google Chrome
  proxy-client: Clash Verge Rev + Mihomo
  goal: 普通应用国内直连国外走订阅兜底，Claude专用Chrome获得浏览器级全代理与账号目录隔离

security-boundaries:
  - 不保存或复制账号密码、Cookie、2FA、Login Data、订阅URL、节点密钥
  - 不修改远程订阅YAML
  - 不根据节点名称自动声称住宅、原生或纯净
  - 不把第三方检测分数当成Anthropic官方保证
  - 所有节点选择由用户人工完成
  - 不使用虚假身份付款资料或网络配置绕过封禁与官方身份核验
  - 网络与检测站绿灯不等于Anthropic账号永久安全
  - 实际所在地账号资格和付款必须符合Anthropic当前支持地区与条款

system-routing:
  mode: rule
  tun-enabled: true
  system-proxy-enabled: false
  general-mixed-port: 43865
  general-traffic-policy:
    domestic: 国内域名和国内IP走DIRECT
    foreign: 通用国外服务走订阅原生规则和最终MATCH兜底
    excluded-custom-rules:
      - OpenAI
      - GitHub
      - X
      - Grok
      - YouTube
    reason: 这些通用国外规则若与MATCH目标相同就是重复；Claude隔离只由Claude顶层规则和ACCOUNT-US负责
  dns:
    enhanced-mode: fake-ip
    ipv6: false
    forbidden-binding: '把 DNS 绑定到订阅自带的组名（形如 `#<组名>&disable-ipv6`）；只允许 #ACCOUNT-US'
    nameservers:
      - 8.8.8.8
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

account-channel:
  group:
    name: ACCOUNT-US
    type: select
    include-all-proxies: true
    exclude-type: Direct|Reject
    node-selection: manual
  listener:
    name: account-us-socks
    type: socks
    listen: 127.0.0.1
    port: 43866
    udp: false
  first-rule: IN-NAME,account-us-socks,ACCOUNT-US

claude-rules:
  policy: ACCOUNT-US
  source-policy: 官方核心域名优先，第三方候选经本机验证后补充
  merge-policy: 只维护Claude置顶规则；通用国外服务不并入当前Claude方案
  required-rules:
    - DOMAIN-SUFFIX,anthropic.com,ACCOUNT-US
    - DOMAIN-SUFFIX,claude.ai,ACCOUNT-US
    - DOMAIN-SUFFIX,claude.com,ACCOUNT-US
    - DOMAIN-SUFFIX,claude.app,ACCOUNT-US
    - DOMAIN-SUFFIX,clau.de,ACCOUNT-US
    - DOMAIN-SUFFIX,claudemcpclient.com,ACCOUNT-US
    - DOMAIN-SUFFIX,claudemcpcontent.com,ACCOUNT-US
    - DOMAIN-SUFFIX,claudeusercontent.com,ACCOUNT-US
    - DOMAIN,servd-anthropic-website.b-cdn.net,ACCOUNT-US
    - DOMAIN,anthropic.com.cdn.cloudflare.net,ACCOUNT-US
    - DOMAIN,anthropic.auth0.com,ACCOUNT-US
    - DOMAIN,anthropic-com.ghost.io,ACCOUNT-US
    - IP-CIDR,160.79.104.0/21,ACCOUNT-US,no-resolve
    - IP-CIDR6,2607:6bc0::/32,ACCOUNT-US,no-resolve
    - IP-ASN,399358,ACCOUNT-US,no-resolve
  optional-telemetry-rules:
    enabled-in-current-script: false  # 2026-09-23 核对：现场 Script.js 把这些规则列为旧规则并清除，验证脚本要求它们不存在
    tradeoff: 出口更一致，但这些服务不是Anthropic独占，可能让其他应用遥测也走Claude出口
    rules:
    - DOMAIN-SUFFIX,sentry.io,ACCOUNT-US
    - DOMAIN-SUFFIX,statsigapi.net,ACCOUNT-US
    - DOMAIN,browser-intake-us5-datadoghq.com,ACCOUNT-US
    - DOMAIN-KEYWORD,datadog,ACCOUNT-US
    - DOMAIN-KEYWORD,sift,ACCOUNT-US
    - DOMAIN-SUFFIX,intercom.io,ACCOUNT-US
    - DOMAIN-SUFFIX,intercomcdn.com,ACCOUNT-US
    - DOMAIN,cdn.usefathom.com,ACCOUNT-US
  intentionally-excluded:
    - rule: GEOSITE,category-ntp,ACCOUNT-US
      reason: NTP不返回时区；不是Anthropic官方要求；避免扩大到全机UDP流量
    - rule: OpenAI/GitHub/X/Grok等通用国外服务规则
      reason: 交给订阅原生规则和MATCH兜底；不属于Claude顶层强制规则

browser-template:
  one-user-data-per-account: true
  root-template: '%LOCALAPPDATA%\ClaudeAccountBrowsers\<alias>\UserData'
  copy-old-profile: false
  arguments:
    - '--user-data-dir="%LOCALAPPDATA%\ClaudeAccountBrowsers\<alias>\UserData"'
    - '--proxy-server="socks5://127.0.0.1:43866"'
    - '--host-resolver-rules="MAP * ~NOTFOUND, EXCLUDE 127.0.0.1, EXCLUDE localhost"'
    - '--lang=en-US'
    - '--accept-lang="en-US,en"'
    - '--force-webrtc-ip-handling-policy=disable_non_proxied_udp'
  first-start-url: https://ip.net.coffee/claude/
  host-resolver-rules-status:
    current: Chrome显示不受支持的命令行参数警告
    chromium-design-doc: 记录了SOCKS5配合该参数阻止额外本地解析的用法
    action: 未完成DNS页面A-B验收前不得直接移除
    migration-candidate: 每个独立User Data使用Chrome安全DNS并配合官方WebRTC策略
  manual-actions:
    - 登录前完成IP、DNS、WebRTC、IPv6、语言、时区检测
    - 网站请求位置权限时拒绝
    - 用户亲自登录，不导入其他账号的浏览器数据

claude-code:
  browser-socks-is-not-reused-directly: true
  official-proxy-type: HTTP_OR_HTTPS
  environment-variables:
    - HTTP_PROXY
    - HTTPS_PROXY
  note: Claude Code官方文档说明不直接支持SOCKS；需要单独的HTTP或mixed入口

acceptance:
  automated:
    - mode为rule
    - TUN开启且系统代理关闭
    - 43865与43866均由Mihomo监听
    - ACCOUNT-US存在并选择节点
    - Claude规则全部指向ACCOUNT-US
    - Claude规则全部指向ACCOUNT-US，不指向任何订阅自带的组
    - DNS绑定后缀只出现ACCOUNT-US
    - Mihomo配置校验通过
    - 飞书普通链路可访问
    - 43866有稳定公网IPv4出口
  browser-manual:
    - chrome://version命令行含独立user-data-dir和43866
    - Claude出口属于用户预期支持地区
    - DNS没有本地运营商泄漏
    - WebRTC没有非代理公网IP
    - 没有公网IPv6
    - navigator.language为en-US
    - JavaScript时区与稳定出口地区不矛盾
    - Chrome位置权限为拒绝或未授权
  screenshots:
    - 顶部出口评分属性安全检测
    - 中部DNS WebRTC IPv6时区语言
    - 未出现在截图里的项目必须标记为未验证

source-urls:
  official-claude-code-proxy: https://docs.anthropic.com/en/docs/claude-code/corporate-proxy
  official-supported-countries: https://www.anthropic.com/supported-countries
  official-location-use: https://privacy.anthropic.com/en/articles/11186740-does-claude-use-my-location
  chromium-socks: https://chromium.googlesource.com/website/+/HEAD/site/developers/design-documents/network-stack/socks-proxy/index.md
  chrome-webrtc-policy: https://chromeenterprise.google/policies/web-rtc-ip-handling/
  chrome-doh-policy: https://chromeenterprise.google/policies/dns-over-https-mode/
  ntp-rfc: https://www.rfc-editor.org/rfc/rfc5905
  third-party-rule-candidate: https://ip.net.coffee/claude/site.html
  third-party-detector: https://ip.net.coffee/claude/
