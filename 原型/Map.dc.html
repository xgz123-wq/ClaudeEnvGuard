<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>功能地图</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f3efe6}
a{color:#a8431f}a:hover{color:#7a2f14}
</style>
</helmet>
<div style="min-height: 100vh; background: #f3efe6; color: #1f1b16; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif; font-size: 14px; line-height: 1.55; box-sizing: border-box; padding: 24px 16px 48px;">
<div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">

<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 style="margin: 0; font-size: 26px; font-weight: 600;">功能地图：每个功能的按钮在哪</h1>
<span style="color: #4a443b;">按原版《重构需求.md》逐条对过：功能一个没少，只是换了位置；新增的只有「更新」和「记录」。</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px;">
<sc-for list="{{areas}}" as="ar" hint-placeholder-count="4">
<div style="{{ar.style}}">
<span style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 17px; font-weight: 600;">{{ar.name}}</span><span style="font-size: 12px; color: #4a443b;">{{ar.where}}</span></span>
<span style="font-size: 13px; color: #4a443b;">{{ar.job}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{ar.items}}" as="it" hint-placeholder-count="4">
<span style="font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #fbf9f4; border: 1px solid #ddd4c3;">{{it}}</span>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 18px; font-weight: 600;">逐条对照</span>
<div style="overflow-x: auto; border: 1px solid #ddd4c3; border-radius: 8px; background: #fbf9f4;">
<div style="min-width: 820px;">
<div style="display: grid; grid-template-columns: 1.3fr 1.6fr 2.2fr 0.7fr; gap: 12px; padding: 10px 16px; background: #ebe5d8; font-size: 12px; color: #4a443b;">
<span>功能</span><span>原版在哪</span><span>新版在哪</span><span>变化</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<div style="display: grid; grid-template-columns: 1.3fr 1.6fr 2.2fr 0.7fr; gap: 12px; padding: 10px 16px; border-top: 1px solid #ddd4c3; align-items: start; font-size: 13px;">
<span style="font-weight: 600;">{{r.f}}</span>
<span style="color: #4a443b;">{{r.old}}</span>
<span>{{r.now}}</span>
<span><span style="{{r.tagStyle}}">{{r.tag}}</span></span>
</div>
</sc-for>
</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const A = (name, where, job, items, color) => ({ name, where, job, items, style: 'display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 12px; background: ' + color + '; border: 1px solid #ddd4c3;' });
    const areas = [
      A('体检', '页签 1', '现在能不能用、哪里要处理、一键修', ['自动检查', '线路图', '6 张分类卡片', '一键修复', '撤销（10 秒）', '目标地区', '选专用浏览器', '打开浏览器', '复核 IP', '清理登录 ×3'], '#f6f2ea'),
      A('更新', '页签 2', '三端有没有新版本、一键更新、看进度', ['自动查版本', '5 步流程', '剩余时间', '出错分三层', '最近几次'], '#f6f2ea'),
      A('记录', '页签 3', '卫士改过这台电脑什么，像版本记录', ['修复', '还原', '更新', '清理', '改前 → 改后', '还原这次'], '#f6f2ea'),
      A('设置 与 ⋯', '右上角', '不常用的放这里', ['三个端口', '目标地区', '默认浏览器', '分享包目录', '数据位置', '离线检查', '复制报告', '打开日志'], '#ebe5d8')
    ];
    const T = { same: ['保留', '#dcebdf', '#1f5c38'], move: ['换位置', '#f4e5c8', '#6e4708'], better: ['加强', '#e5e0f1', '#4a3b78'], add: ['新增', '#f4dccf', '#7a2f14'] };
    const R = (f, old, now, t) => ({ f, old, now, tag: T[t][0], tagStyle: 'font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; background: ' + T[t][1] + '; color: ' + T[t][2] + ';' });
    const rows = [
      R('检查', '右上「重新检查」，F5', '打开自动查；体检页结论区主按钮；F5 保留', 'same'),
      R('检查进度', '只显示「检查中」', '结论区「本机配置 ✓ · 测线路 2/3」，连线流动、卡片逐个亮', 'better'),
      R('离线检查', '右上开关', '⋯ 菜单', 'move'),
      R('28 项检查明细', '左侧 5 个页签 + 长列表', '6 张卡片（需要处理 / 线路 / 浏览器 / Code / Desktop / 系统）+ 下方明细，通过的项收起', 'move'),
      R('线路图（三入口 → 出口）', '顶部右侧', '体检页右上，点它看 P1–P5', 'same'),
      R('目标地区（跟随出口 / 手选）', '中间「目标环境」条', '结论区下方一行「随 IP 项按：… 改」+ 设置页', 'move'),
      R('一键修复', '右上按钮 → 弹窗勾选', '结论区主按钮 → 明细区展开计划，逐项打勾进度，修完自动重查', 'better'),
      R('还原修复', '右上「还原」→ 弹窗列表，整次还原', '「记录」页：每次改动的改前 → 改后，勾哪几项就只还原哪几项；修完 10 秒内结论区也能整次撤销', 'better'),
      R('选专用浏览器', '浏览器页签顶部下拉', '浏览器卡片明细上方；默认值在设置页', 'move'),
      R('打开这个浏览器 / 复核 IP', '浏览器页签顶部', '浏览器卡片明细上方', 'move'),
      R('清理登录（浏览器 / Code / Desktop）', '各页签顶部 → 弹窗', '对应卡片明细上方 → 清单 + 「核对过，删了不能恢复」→ 记进「记录」页', 'better'),
      R('复制报告', '右上按钮', '⋯ 菜单；出错时「复制给 AI 排查」另有一份精简版', 'move'),
      R('设置（端口、地区、浏览器、分享包、起始网址）', '右上「设置」弹窗', '右上 ⚙ → 设置页，另列出数据放在哪、能直接打开', 'better'),
      R('日志', '只在磁盘上', '⋯ → 打开日志目录；设置页「数据放在哪」', 'better'),
      R('三端更新', '桌面单独图标，终端滚字', '「更新」页：5 步流程、剩余时间、出错分三层', 'add'),
      R('改动历史', '没有（备份在磁盘上）', '「记录」页：修复、还原、更新、清理按时间排', 'add'),
      R('命令行 ceg.exe', 'check / fix / restore / clean', '不变，加 ceg update --check', 'same')
    ];
    return { areas, rows };
  }
}
</script>
</body>
</html>
